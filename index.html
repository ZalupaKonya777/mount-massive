<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mount Massive">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Mount Massive · Прибытие</title>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

<style>
:root { color-scheme: dark; background:#080e0c; color:#b8c4af; font-family:system-ui,-apple-system,sans-serif }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
[hidden] { display:none !important }
html,body { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none }
#stage { position:fixed; top:env(safe-area-inset-top,0px); left:env(safe-area-inset-left,0px); right:env(safe-area-inset-right,0px); bottom:env(safe-area-inset-bottom,0px); }
canvas { width:100%;height:100%;display:block;outline:none;touch-action:none }
#cover,#rotate { position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#15241d,#080e0c 72%);padding:24px;padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right)) }
.card { max-width:550px;text-align:center }
.eyebrow { font-size:10px;letter-spacing:.32em;color:#7b8f7c }
h1 { margin:12px 0;font-weight:500;font-size:clamp(28px,5vw,49px);letter-spacing:.14em;line-height:1.1 }
p { font-size:14px;line-height:1.5;color:#8c9c8b }
button { min-height:50px;min-width:210px;border:1px solid #526553;background:#1b2a21;color:#c9d3bd;font:500 16px system-ui;letter-spacing:.05em;padding:13px 24px;border-radius:3px;cursor:pointer;touch-action:manipulation }
button:disabled { opacity:.5 }
progress { display:block;width:min(400px,74vw);height:5px;margin:20px auto;accent-color:#809c7e }
#details { white-space:pre-wrap;word-break:break-word;font-size:11px;color:#b78b78;max-height:90px;overflow:auto;user-select:text }
#rotate { display:none;z-index:9;background:#080e0c }
#rotate span { font-size:44px;display:block;margin-bottom:15px }
#resume-audio { position:fixed;z-index:8;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);min-width:0;min-height:40px;font-size:12px;padding:8px 14px;background:#16251e }
@media (orientation:portrait) { #rotate { display:grid } }
@media (max-height:440px) { .eyebrow{font-size:9px} h1{font-size:28px;margin:8px 0}p{margin:8px 0;font-size:12px}progress{margin:12px auto} }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="0" aria-label="Игровой экран"></canvas></div>
<div id="cover"><div class="card"><div class="eyebrow">COLORADO · 23:17</div><h1>MOUNT MASSIVE</h1><p>П Р И Б Ы Т И Е</p><p id="status">Первый запуск загрузит игровые ресурсы.<br>Поверни телефон горизонтально. Лучше играть в наушниках.</p><progress id="progress" hidden></progress><button id="launch">Загрузить игру</button><p id="details" hidden></p></div></div>
<div id="rotate"><div class="card"><span>↻</span><p>Поверни iPhone горизонтально</p></div></div>
<button id="resume-audio" hidden>Нажми, чтобы включить звук</button>
<script src="mobile_audio.js?v=8abbddbe10c0"></script>
<script src="index.js?v=8abbddbe10c0"></script>
<script>
'use strict';
const config={"args":[],"canvasResizePolicy":0,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":72584448,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const pack=config.executable+'.pck',packUrl=pack+'?v=8abbddbe10c0';
config.fileSizes[packUrl]=config.fileSizes[pack];
const canvas=document.getElementById('canvas'),stage=document.getElementById('stage');
const cover=document.getElementById('cover'),button=document.getElementById('launch');
const progress=document.getElementById('progress'),status=document.getElementById('status');
const portrait=matchMedia('(orientation: portrait)');
window.outlastLogs=[];
function record(kind,args){ const line=Array.from(args).join(' '); window.outlastLogs.push({kind,line});if(window.outlastLogs.length>120)window.outlastLogs.shift();console[kind==='error'?'error':'log'](line) }
function resize(){
 const r=stage.getBoundingClientRect(),ratio=Math.min(window.devicePixelRatio||1,1.0);
 canvas.width=Math.max(1,Math.round(r.width*ratio));canvas.height=Math.max(1,Math.round(r.height*ratio));
 if(portrait.matches && window.outlastPause)window.outlastPause();
}
new ResizeObserver(resize).observe(stage);window.addEventListener('resize',resize);resize();
config.canvas=canvas;config.canvasResizePolicy=0;config.focusCanvas=true;
if(new URLSearchParams(location.search).has('qa')) config.args=['--','--web-qa'];
Object.assign(config,{onPrint:(...a)=>record('log',a),onPrintError:(...a)=>record('error',a),onProgress:(current,total)=>{if(total>0){progress.max=total;progress.value=current;status.textContent='Загрузка · '+Math.min(100,Math.round(current/total*100))+'%'}else{progress.removeAttribute('value');status.textContent='Подготовка игры…'}}});
const engine=new Engine(config);
window.outlastEngine=engine;
let phase='download';
async function wake(){try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen')}catch{}}
function fail(error){phase='failed';status.textContent='Не удалось запустить игру';const details=document.getElementById('details');details.hidden=false;details.textContent=error.message||String(error);button.textContent='Перезагрузить';button.disabled=false;record('error',[error]);}
button.addEventListener('click',async()=>{
 if(phase==='failed'){location.reload();return}
 if(phase==='download'){
  phase='loading';button.disabled=true;progress.hidden=false;status.textContent='Загрузка…';
  try{
   const missing=Engine.getMissingFeatures({threads:false});
   if(missing.length)throw Error('Для запуска требуется WebGL 2. Обнови браузер. '+missing.join(', '));
   await Promise.all([engine.init(config.executable),engine.preloadFile(packUrl,pack)]);
   phase='ready';progress.hidden=true;status.textContent='Готово. Нажми «Играть» — это включит звук.';button.textContent='Играть';button.disabled=false;
  }catch(error){fail(error)}
  return;
 }
 if(phase!=='ready')return;
 phase='starting';button.disabled=true;status.textContent='Подготовка уровня…';
 window.outlastAudio.prime();wake();
 if(navigator.maxTouchPoints>0 && !/iP(hone|ad|od)/.test(navigator.userAgent)){
  try{document.documentElement.requestFullscreen?.({navigationUI:'hide'}).then(()=>screen.orientation?.lock?.('landscape')).catch(()=>{});}catch{}
 }
 requestAnimationFrame(()=>setTimeout(async()=>{
  try{
   await engine.start({args:['--main-pack',pack,...(config.args||[])]});
   cover.remove();canvas.focus();resize();window.outlastStarted=true;window.outlastAudio.update();
   if('serviceWorker' in navigator && window.isSecureContext)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }catch(error){fail(error)}
 },50));
});
document.getElementById('resume-audio').addEventListener('click',()=>window.outlastAudio.prime());
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(window.outlastPause)window.outlastPause();window.outlastAudio.suspend()}else{window.outlastAudio.update();wake()}});
window.addEventListener('pagehide',()=>{if(window.outlastPause)window.outlastPause();window.outlastAudio.suspend()});
document.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
</script>
</body></html>
