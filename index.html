<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Mount Massive — Outlast opening reconstruction (prototype)</title>
		<!-- Page shell of the web build (tools/web/build_web.py). Unlike Godot's default page it downloads the game
		     first and starts it on a tap: the tap lets the browser play sound from the first second (iPhone keeps
		     the page silent until the player touches it) and, on Android, switches to fullscreen landscape. -->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #ddd;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	overscroll-behavior: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	z-index: 5;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 16px;
	padding: 24px;
	background: #000;
	color: #c9c6bc;
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	text-align: center;
	cursor: default;
}

#status h1 {
	margin: 0;
	font-size: 22px;
	font-weight: 600;
	letter-spacing: 0.18em;
	color: #e8e4d9;
}

#status-bar {
	width: min(60vw, 420px);
	height: 6px;
	border-radius: 3px;
	background: #262626;
	overflow: hidden;
}

#status-fill {
	width: 0;
	height: 100%;
	background: #b8b19a;
	transition: width 0.2s;
}

#status-text, #status-tip {
	min-height: 1.4em;
	font-size: 14px;
	color: #8e8b81;
}

#status-start {
	display: none;
	padding: 14px 30px;
	border: 1px solid #7a776d;
	border-radius: 10px;
	background: rgba(255, 255, 255, 0.06);
	color: #ece8dd;
	font-family: inherit;
	font-size: 18px;
	cursor: pointer;
	-webkit-appearance: none;
	appearance: none;
}

#status.ready #status-start {
	display: block;
}

#status.ready #status-bar, #status.starting #status-bar {
	display: none;
}

#status.ready {
	cursor: pointer;
}

#status-spinner {
	display: none;
	width: 30px;
	height: 30px;
	border: 3px solid #2c2c2c;
	border-top-color: #b8b19a;
	border-radius: 50%;
	animation: status-spin 0.9s linear infinite;
}

#status.starting #status-spinner {
	display: block;
}

@keyframes status-spin {
	to {
		transform: rotate(360deg);
	}
}

#status-notice {
	display: none;
	max-width: 520px;
	padding: 14px 18px;
	border: 1px solid #9b3943;
	border-radius: 8px;
	background: #3d2328;
	color: #eadada;
	font-size: 15px;
	line-height: 1.4;
	white-space: pre-line;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mount Massive"><meta name="theme-color" content="#000000"><style>html,body{overscroll-behavior:none;touch-action:none}#rotate-hint{display:none;position:fixed;inset:0;z-index:10;background:#000;color:#ccc;font:18px sans-serif;align-items:center;justify-content:center;text-align:center;padding:24px}@media (orientation:portrait) and (pointer:coarse){#rotate-hint{display:flex}}</style><script>addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='rotate-hint';d.textContent='Поверните телефон горизонтально';document.body.appendChild(d);});</script>
	</head>
	<body>
		<canvas id="canvas">Браузер не поддерживает canvas.</canvas>
		<noscript>Для игры нужен JavaScript.</noscript>

		<div id="status">
			<h1>MOUNT MASSIVE</h1>
			<div id="status-bar"><div id="status-fill"></div></div>
			<div id="status-spinner"></div>
			<div id="status-text">Загрузка…</div>
			<button id="status-start" type="button">Коснитесь, чтобы начать</button>
			<div id="status-tip">Лучше в наушниках</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":86434448,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;

(function () {
	const status = document.getElementById('status');
	const fill = document.getElementById('status-fill');
	const text = document.getElementById('status-text');
	const start = document.getElementById('status-start');
	const notice = document.getElementById('status-notice');
	const touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
	start.textContent = touch ? 'Коснитесь, чтобы начать' : 'Нажмите, чтобы начать';

	function fail(err) {
		console.error(err);
		status.classList.remove('ready', 'starting');
		document.getElementById('status-bar').style.display = 'none';
		text.textContent = 'Игра не запустилась';
		notice.textContent = (err && err.message) ? err.message : String(err);
		notice.style.display = 'block';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('Браузеру не хватает того, что нужно игре:\n' + missing.join('\n')
				+ '\n\nОбновите браузер: нужен WebGL 2 (Safari 15+, Chrome 56+).');
		return;
	}

	const exe = GODOT_CONFIG['executable'];
	const pack = GODOT_CONFIG['mainPack'] || exe + '.pck';
	const engine = new Engine(Object.assign({}, GODOT_CONFIG, {
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				fill.style.width = (100 * current / total).toFixed(1) + '%';
				text.textContent = 'Загрузка: ' + (current / 1048576).toFixed(0) + ' из ' + (total / 1048576).toFixed(0) + ' МБ';
			}
		},
	}));

	let started = false;

	function go() {
		if (started) {
			return;
		}
		started = true;
		try {
			if (navigator.audioSession) {
				navigator.audioSession.type = 'playback';  // iPhone (Safari 17+): play even with the silent switch on
			}
		} catch (e) {
			// optional
		}
		if (touch) {
			// Android: fullscreen, then landscape (a lock only works in fullscreen). iPhone Safari has no
			// fullscreen for pages: there the game fills the window, or the whole screen from the home screen.
			const el = document.documentElement;
			const request = el.requestFullscreen || el.webkitRequestFullscreen;
			try {
				const p = request ? request.call(el, { navigationUI: 'hide' }) : null;
				if (p && p.then) {
					p.then(function () {
						if (screen.orientation && screen.orientation.lock) {
							screen.orientation.lock('landscape').catch(function () {});
						}
					}).catch(function () {});
				}
			} catch (e) {
				// no fullscreen here
			}
		}
		status.classList.remove('ready');
		status.classList.add('starting');
		text.textContent = 'Запуск… Уровень грузится целиком: на телефоне это до минуты, экран пока может замереть';
		// Godot loads the whole level in one go and the page stops drawing until that is done: let the message and
		// the spinner (it turns on its own meanwhile) reach the screen first, or the tap looks ignored.
		requestAnimationFrame(function () {
			setTimeout(function () {
				engine.start({ 'args': ['--main-pack', pack].concat(GODOT_CONFIG['args'] || []) }).then(function () {
					status.remove();
				}, fail);
			}, 60);
		});
	}

	Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(function () {
		text.textContent = '';
		status.classList.add('ready');
		start.addEventListener('click', go);
		status.addEventListener('click', go);
	}, fail);
}());
		</script>
	</body>
</html>
